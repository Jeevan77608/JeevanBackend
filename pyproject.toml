[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-devops-mcp-server"
version = "0.1.0"
description = "Azure DevOps MCP Server - AI-powered work item generation and management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "cryptography>=42.0.0",
    "msal>=1.26.0",
    "openai>=1.10.0",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3.0",
    "tenacity>=8.2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "N815",   # mixed-case-variable-in-class-scope (Pydantic models match Azure DevOps API JSON fields)
    "N806",   # non-lowercase-variable-in-function (constants like MAX_FILE_SIZE)
    "UP042",  # replace-str-enum (str+Enum is needed for Python <3.11 compat in serialization)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"

